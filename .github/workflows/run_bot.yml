name: PSU Job Tracker Daily Run

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true 

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 google-genai googlenewsdecoder python-dotenv

      - name: Execute PSU Job Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Commit and Push Updated History
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update seen_jobs.txt history"
          file_pattern: "seen_jobs.txt"
